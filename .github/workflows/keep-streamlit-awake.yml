name: Keep Streamlit app awake

on:
  schedule:
    # Every 6 hours (UTC), off the hour to avoid peak scheduling delays
    - cron: "17 */6 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://a320-benchmark-social-media.streamlit.app
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit app and wake it if sleeping
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(8_000)

              wake = page.get_by_role("button", name="get this app back up", exact=False)
              if wake.count() > 0:
                  print("App was asleep - clicking wake-up button")
                  wake.first.click()
                  page.wait_for_timeout(90_000)  # give the app time to boot
              else:
                  print("App is awake")
                  page.wait_for_timeout(20_000)  # hold the session briefly so it counts as a visit

              print("Final page title:", page.title())
              browser.close()
          PY
